[package]
name = "tauri-app"
version = "0.1.0"
description = "Gestor Notas FP - Tauri Application"
rust-version = "1.60"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.11", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
