name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      JAVA_VERSION: '17'
      RUST_BACKTRACE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android build dependencies
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"

      - name: Install dependencies
        run: npm ci

      - name: Build APK
        run: npm run android:build:apk -- --verbose

      - name: Locate APKs
        id: locate_apk
        run: |
          set -e
          mkdir -p artifacts
          find src-tauri -type f \( -name "*.apk" -o -name "*.aab" \) -print | tee artifacts/found-artifacts.txt
          APK_COUNT=$(find src-tauri -type f -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "No APK generated" >&2
            exit 1
          fi
          find src-tauri -type f -name "*.apk" -exec cp {} artifacts/ \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestor-notas-fp-android-apk
          path: artifacts/
          if-no-files-found: error
